name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
      title:
        description: "Release title"
        required: true
        default: "TraceBoard 0.1.0 (local portable)"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Record JDK21 home
        shell: pwsh
        run: echo "JAVA21_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Build SDK
        shell: pwsh
        run: |
          cd frontend/sdk
          npm ci
          npm run build

      - name: Build workbench (packaged, no demo)
        shell: pwsh
        run: |
          cd workbench
          npm ci
          npm run build:packaged

      - name: Build agent/collector/launcher (JDK21)
        shell: pwsh
        run: mvn -B -q -DskipTests package

      - name: Setup Temurin 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Record JDK8 home
        shell: pwsh
        run: echo "JAVA8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Build demo backend (JDK8)
        shell: pwsh
        run: |
          cd demo/buggy-shop-boot-vue/backend
          mvn -B -q -DskipTests package

      - name: Build portable zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -OutDir dist/release
          Get-ChildItem dist/release | Select-Object Name,Length

      - name: Build self-contained EXE app-image (Temurin)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-exe.ps1 `
            -Java21 "$env:JAVA21_HOME" -Java8 "$env:JAVA8_HOME" `
            -BundleJre8 "$env:JAVA8_HOME" -BundleJre21 "$env:JAVA21_HOME" `
            -OutDir dist/exe
          $exeDir = Join-Path (Get-Location) "dist/exe/TraceBoard"
          if (-not (Test-Path (Join-Path $exeDir "TraceBoard.exe"))) { throw "TraceBoard.exe missing" }
          if (-not (Test-Path (Join-Path $exeDir "runtime/jre8/bin/java.exe"))) { throw "bundled JRE8 missing" }
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $exeZip = Join-Path (Get-Location) "dist/release/TraceBoard-0.1.0-win-x64-exe.zip"
          Compress-Archive -Path (Join-Path $exeDir "*") -DestinationPath $exeZip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $exeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($exeZip))" | Set-Content -LiteralPath "$exeZip.sha256" -Encoding ASCII
          Write-Host "EXE_ZIP=$exeZip"
          Write-Host "EXE_SHA256=$hash"

      - name: Smoke test packaged static UI
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/release/*.zip | Select-Object -First 1
          if (-not $zip) { throw "portable zip missing" }
          $check = Join-Path $env:RUNNER_TEMP "tb-check"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $check
          if (-not (Test-Path (Join-Path $check "workbench/index.html"))) { throw "workbench missing" }
          if (Test-Path (Join-Path $check "workbench/demo")) { throw "packaged workbench must not include demo assets" }
          if (-not (Test-Path (Join-Path $check "app/collector.jar"))) { throw "collector missing" }
          if (-not (Test-Path (Join-Path $check "app/demo.jar"))) { throw "demo missing" }
          Write-Host "portable package content OK"

      - name: Create private Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $assets = @(Get-ChildItem dist/release/*.zip, dist/release/*.sha256 | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw "expected two zip + two sha256 assets, got $($assets.Count)" }
          gh release create $version @assets --title "${{ inputs.title }}" --notes-file docs/plans/RELEASE-NOTES-v0.1.0.md --target $env:GITHUB_SHA