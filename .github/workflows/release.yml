name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      title:
        description: "Release title"
        required: true
        default: "TraceBoard 1.0.0 (Windows portable)"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Setup Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build workbench (packaged, generic-only)
        shell: pwsh
        run: |
          cd workbench
          npm ci
          npm run build:packaged

      - name: Build agent/collector/launcher (JDK21)
        shell: pwsh
        run: mvn -B -q -DskipTests package

      - name: Build portable zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -OutDir dist/release
          Get-ChildItem dist/release | Select-Object Name,Length

      - name: Smoke test portable package
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/release/TraceBoard-1.0.0-win-x64-portable.zip
          if (-not $zip) { throw "portable zip missing" }
          $check = Join-Path $env:RUNNER_TEMP "tb-check"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $check -Force
          foreach ($file in @(
            "TraceBoard.cmd",
            "IMPORTANT-NOTES.md",
            "README-PORTABLE.txt",
            "app/agent.jar",
            "app/collector.jar",
            "app/launcher.jar",
            "workbench/index.html"
          )) {
            if (-not (Test-Path (Join-Path $check $file))) { throw "package missing: $file" }
          }
          if (Test-Path (Join-Path $check "workbench/demo")) { throw "package must not include demo assets" }
          if (Test-Path (Join-Path $check "workbench/fixtures")) { throw "package must not include fixtures" }
          if (Test-Path (Join-Path $check "app/demo.jar")) { throw "package must not include demo.jar" }
          Write-Host "portable package content OK"

      - name: Create Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $assets = @(Get-ChildItem dist/release/*.zip, dist/release/*.sha256 | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw "expected zip + sha256, got $($assets.Count) assets" }
          gh release create $version @assets --title "${{ inputs.title }}" --notes-file docs/releases/v1.0.0.md --target $env:GITHUB_SHA