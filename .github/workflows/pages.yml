name: Deploy static showcase to GitHub Pages

on:
  push:
    paths:
      - "site/traceboard/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -f site/traceboard/dist/index.html
          test -f site/traceboard/dist/app/index.html
          grep -q 'type="module"' site/traceboard/dist/app/index.html
          grep -q 'demo-data.js' site/traceboard/dist/app/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload prebuilt static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/traceboard/dist

      - name: Wait for artifact metadata
        run: sleep 10

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4