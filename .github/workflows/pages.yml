name: pages

on:
  push:
    branches: [master, main]
    paths:
      - "site/traceboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/traceboard/index.html _site/index.html
          cp -r site/traceboard/assets _site/assets
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/app.js
          test -s _site/assets/styles.css
          grep -q "TraceBoard" _site/index.html
          if grep -RInE "https?://|//cdn|@import" _site/index.html _site/assets; then
            echo "external dependency found" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4